[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "raw-development-analysis"
version = "0.1.0"
description = "Semantic registry and conformance tooling for RAW Development Analysis"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rda = "rda_toolchain.cli:main"

[tool.setuptools.packages.find]
include = ["rda_toolchain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
